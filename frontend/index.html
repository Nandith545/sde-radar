<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offerly — resume-matched job tracking for software engineers." />
    <meta name="theme-color" content="#F2F6F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1116" media="(prefers-color-scheme: dark)" />
    <!-- Stamps the theme before first paint. React only sets data-theme after
         hydration, so without this a user who forced light on a dark-OS
         machine gets a dark flash on every load. Resolving it to a concrete
         value here is also what lets styles.css carry one dark block instead
         of maintaining the same values under a media query as well. -->
    <script>
      (function () {
        try {
          var stored =
            localStorage.getItem("offerly_theme") ||
            localStorage.getItem("sde_radar_theme");
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (e) {
          /* storage blocked -- the media query in styles.css takes over */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Offerly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
