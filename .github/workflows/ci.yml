name: CI

# Runs on every push to main or staging, and every pull request targeting
# them, so no change reaches either environment without the full suite
# passing first.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Lets you re-run the pipeline by hand from the Actions tab.
  workflow_dispatch:

# If you push twice in quick succession to the same branch, cancel the older
# run instead of burning minutes on a result nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Backend: dedup/ingestion regression test against a real Postgres,
  # matching what runs in production (not SQLite).
  # -------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sderadar
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: sderadar_test
        ports:
          - 5432:5432
        # Don't start the test job until Postgres is actually accepting
        # connections, otherwise the first query races the container.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sderadar:testpassword@localhost:5432/sderadar_test
      JWT_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/ tests/

      - name: Check formatting (ruff)
        working-directory: backend
        run: ruff format --check app/ tests/

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy

      - name: Verify migrations match the models
        working-directory: backend
        run: |
          alembic upgrade head
          # An autogenerate that produces changes means someone edited
          # models.py without adding a migration -- which would deploy fine
          # and then break at runtime on a real database.
          alembic check

      - name: Run tests
        working-directory: backend
        env:
          # Exercise the suite against the same engine production uses, not
          # the SQLite fallback.
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  # -------------------------------------------------------------------
  # Frontend: lint, type-check and production build.
  # `npm run build` is `tsc -b && vite build`, so a type error fails here.
  # -------------------------------------------------------------------
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------------
  # End-to-end: build the real frontend, serve it from the real backend
  # against a real Postgres, and drive it with a real browser.
  # -------------------------------------------------------------------
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sderadar
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: sderadar_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sderadar:testpassword@localhost:5432/sderadar_e2e
      JWT_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend into the backend's static dir
        working-directory: frontend
        run: npm run build

      - name: Start the server
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          # Poll the health endpoint rather than sleeping a fixed amount --
          # a fixed sleep is the classic source of flaky CI.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s. Logs:"
          cat /tmp/uvicorn.log
          exit 1

      - name: Run end-to-end smoke test
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8000
        run: npm run test:e2e

      - name: Dump server logs on failure
        if: failure()
        run: cat /tmp/uvicorn.log
