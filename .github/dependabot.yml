version: 2

# Dependabot opens PRs when your dependencies fall behind or a security
# advisory lands. Every PR runs through the same CI as your own commits, so
# you can see whether the bump actually breaks anything before merging.
#
# Grouping is deliberate: without it, a busy week produces a dozen separate
# PRs. Grouped, you get roughly one PR per ecosystem per week.

updates:
  # ---- Python (backend) ----
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(backend)"
    labels: [dependencies, backend]

  # ---- npm (frontend) ----
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(frontend)"
    labels: [dependencies, frontend]

  # ---- GitHub Actions themselves ----
  # Pinned action versions go stale too, and outdated actions are a real
  # supply-chain risk.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(ci)"
    labels: [dependencies, ci]

  # ---- Docker base images ----
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    labels: [dependencies, docker]
