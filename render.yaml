databases:
  - name: sderadar-db
    plan: free
    databaseName: sderadar
    user: sderadar

services:
  - type: web
    name: sde-radar
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Deploys are triggered by the GitHub Actions "Deploy" workflow after CI
    # passes on main -- not automatically on every push. See
    # .github/workflows/deploy.yml and the "Deploy pipeline" section of the
    # README for the one-time RENDER_DEPLOY_HOOK secret setup.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sderadar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
